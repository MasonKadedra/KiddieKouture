<!DOCTYPE html>

<html lang = "en">

		<head>
			<meta charset = "UTF-8">
			<meta name = "viewport" content = "width=device-width, initial-scale=1.0">
			<title> Check out </title>
			<link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
			<link rel = "stylesheet" href = "CSS/Check out.css">
		</head>
		
		<body>

			<div class = "row">
				<div class = "col-75">
					<div class = "container">
						<form action = "Invoice.html" method = "POST">
							<div class = "row">
								<div class = "col-50">
									<h2> CHECKOUT </h2>
									<h3> Billing Address </h3>
									<label for = "fname"> <i class = "fa fa-user"> </i> Full Name </label>
									<input type = "text" id = "fname" name = "firstname" placeholder = "Name.." autocomplete = "name" required>
									<label for = "trn"> <i class = "fa fa-user"> </i> TRN </label>
									<input type = "text" id = "trn" name = "TRN" placeholder = "TRN.." autocomplete = "TRN" required>
									<label for = "email"> <i class = "fa fa-envelope"> </i> Email </label>
									<input type = "email" id = "email" name = "email" placeholder = "email.." autocomplete = "email" required>
									<label for = "adr"> <i class = "fa fa-address-card-o"> </i> Address </label>
									<input type = "text" id = "adr" name = "address" placeholder = "Address.." autocomplete = "street-address" required>
									<label for = "amount-to-pay"> Amount to Pay </label>
									<input type = "number" id = "amount-to-pay" value = "0.00" readonly>
								</div>

								<div class = "col-50">
									<h3> Payment </h3>
									<label for = "fname"> Accepted Cards </label>
									<div class = "icon-container">
										<i class = "fa fa-cc-visa" style = "color:navy;"> </i>
										<i class = "fa fa-cc-amex" style = "color:blue;"> </i>
										<i class = "fa fa-cc-mastercard" style = "color:red;"> </i>
										<i class = "fa fa-cc-discover" style = "color:orange;"> </i>
									</div>
									<label for = "cname"> Name on Card </label>
									<input type = "text" id = "cname" name = "cardname" placeholder = "Name..">
									<label for = "ccnum"> Credit card number </label>
									<input type = "text" id = "ccnum" name = "cardnumber" placeholder = "Card..">
									<label for = "expmonth"> Exp Month </label>
									<input type = "text" id = "expmonth" name = "expmonth">
									<div class = "row">
										<div class = "col-50">
											<label for = "expyear"> Exp Year </label>
											<input type = "text" id = "expyear" name = "expyear">
										</div>
										<div class = "col-50">
											<label for = "cvv"> CVV </label>
											<input type = "text" id = "cvv" name = "cvv">
										</div>
									</div>
								</div>
							</div>
							<label>
								<input type = "checkbox" checked = "checked" name = "sameadr"> Shipping address same as billing
							</label>
							<center>
								<input type = "submit" id = "checkout" value = "Confirm Checkout" class = "btn">
								<a href = "Cart.html" id = "cancel" class = "button"> Cancel </a>
							</center>
						</form>
					</div>
				</div>
				<div class = "col-25">
					<div class = "container">
						<h4> Cart Summary <span class = "price" style = "color:black"> <i class = "fa fa-shopping-cart"> </i> </span> </h4>
						<div id = "cart-summary">
							<div id = "cart-items"> </div>
							<hr>
							<p>Subtotal: <span id = "cart-subtotal"> $0.00 </span> </p>
							<p>Tax (10%): <span id = "cart-tax"> $0.00 </span> </p>
							<p>Total: <span id = "cart-total"> $0.00 </span> </p>
						</div>
					</div>
				</div>
			</div>
			<script src = "Javascript/Check out.js"> </script> <!-- Link to JavaScript file -->
	    </body>
</html>
