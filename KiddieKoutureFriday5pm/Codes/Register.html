<html lang="en">
		<head>
			<meta charset = "UTF-8">
			<meta name = "viewport" content = "width=device-width, initial-scale=1.0">
			<title> Register </title>
			<link rel = "stylesheet" href = "CSS/Register.css">
		</head>
		<body background = "Assets/registerBackground.jpg">
			<div class = "form-container">
				<h1> Register </h1>
				<form id = "registrationForm">
					<!-- Row for First Name and Last Name -->
					<div class = "form-row">
						<div class ="form-group">
							<label for="firstName">First Name:</label>
							<input type="text" id="firstName" name="firstName" required>
						</div>
						<div class="form-group">
							<label for="lastName">Last Name:</label>
							<input type="text" id="lastName" name="lastName" required>
						</div>
					</div>

					<!-- Row for Date of Birth and Gender -->
					<div class="form-row">
						<div class="form-group">
							<label for="dob">Date of Birth:</label>
							<input type="date" id="dob" name="dob" required>
						</div>
						<div class="form-group">
							<label for="gender">Gender:</label>
							<select id="gender" name="gender" required>
								<option value="">Select</option>
								<option value="Male">Male</option>
								<option value="Female">Female</option>
								<option value="Other">Other</option>
							</select>
						</div>
					</div>

					<!-- Row for Email and Phone -->
					<div class="form-row">
						<div class="form-group">
							<label for="email">Email:</label>
							<input type="email" id="email" name="email" required>
						</div>
						<div class="form-group">
							<label for="phone">Phone:</label>
							<input type="tel" id="phone" name="phone" required>
						</div>
					</div>

					<!-- Row for TRN and Password -->
					<div class="form-row">
						<div class="form-group">
							<label for="trn">TRN:</label>
							<input type="text" id="trn" name="trn" pattern="\d{3}-\d{3}-\d{3}" placeholder="123-456-789" required>
						</div>
						<div class="form-group">
							<label for="password">Password:</label>
							<input type="password" id="password" name="password" required minlength="8">
						</div>
					</div>

					<!-- Error and Success Messages -->
					<p id="error-message" class="error-message"></p>
					<p id="success-message" class="success-message"></p>

					<!-- Buttons -->
					<div class="form-buttons">
						<button type="submit">Register</button>
						<button type="reset">Cancel</button>
					</div>

					<!-- Login Link -->
					<p class="login-link"><a href="Log in.html"> Already have an account? Login </a></p>
				</form>
			</div>
			<script src="Javascript/Register.js"></script>
		</body>
</html>
